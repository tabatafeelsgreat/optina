name: Update shop from Square
on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/square_shop.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "nothing new"; exit 0; fi
          git config user.name "parish-site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/shop.json
          git commit -m "Update shop from Square"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
